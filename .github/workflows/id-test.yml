name: Indonesia sources test

# Runs Indonesia sources live (named in the dispatch input; default: the GDP and trade sources) and commits
# their output (data/id, raw/id) to main.
on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Indonesia sources to run"
        default: "id_gdp_bps id_trade_bps"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Excel and PDF readers
        run: pip install xlrd && sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Run the Indonesia sources
        run: python -I pipeline/tools/id_run.py ${{ inputs.sources }} 2>&1 | tee /tmp/report.txt; exit ${PIPESTATUS[0]}
        env:
          BPS_KEY: ${{ secrets.BPS_KEY }}
      - name: Commit output to main
        if: always()
        run: |
          git config user.name "asia-vitals bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p data/id && cp /tmp/report.txt data/id/test_report.txt
          git add data/id raw/id
          git commit -m "ID test run: ${{ inputs.sources }}" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 10; done

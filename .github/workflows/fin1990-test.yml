name: Financial 1990 test (dev-fin1990)
# Runs eq_yahoo (benchmark indices from 1990) and rebuilds the Asia FX files, pushing data/asia back to the branch.
on:
  workflow_dispatch:
  push:
    branches: [dev-fin1990]
    paths: [pipeline/sources/eq_yahoo/**, pipeline/core/asia_fx.py, .github/workflows/fin1990-test.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet yfinance
      - run: |
          python -I - <<'PY' | tee fin1990_report.txt
          import sys, csv
          sys.path.insert(0, "pipeline")
          from sources.eq_yahoo import update
          r = update(force=True)
          print("eq_yahoo:", r["summary"])
          for w in r.get("warnings", []): print("  WARNING:", w)
          from core.asia_fx import build
          print("asia_fx:", build()["summary"])
          first = {}
          for x in csv.DictReader(open("data/asia/eq/asia_eq_daily.csv")):
              first.setdefault(x["economy"], x["date"])
          print("eq first dates:", first)
          PY
      - run: |
          git config user.name "asia-vitals bot"; git config user.email "actions@users.noreply.github.com"
          git add data/asia fin1990_report.txt && git commit -m "Financial 1990 test ${{ github.run_id }}" && git push origin HEAD:${{ github.ref_name }}

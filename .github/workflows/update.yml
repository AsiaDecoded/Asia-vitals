name: Update data

# Wakes twice a day (00:15 and 03:15 UTC = 08:15 and 11:15 Singapore) but runs only the sources
# due that day under pipeline/release_calendar.json (release date to the end of its catch-up window);
# on other days it fetches nothing. A manual run with a sources list (or blank = all) ignores the calendar.
# Each source writes only when it has something new that passes its checks.
on:
  schedule:
    - cron: "15 0,3 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources to run, space-separated (blank = all)"
        default: ""
      push_branch:
        description: "Branch to push results to (use a test branch to try a new source)"
        default: "main"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Excel and PDF readers and numpy
        run: |
          pip install --quiet openpyxl==3.1.5 xlrd==2.0.1 numpy==2.2.6 pypdf==5.1.0 yfinance==1.7.0
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils  # pdftotext, for Indonesia's BPS press releases

      - name: Sources due today (release calendar)
        id: due
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            s="${{ inputs.sources }}"; [ -n "$s" ] || s="all"
          else
            s=$(python -I pipeline/tools/due.py sources)
          fi
          echo "sources=$s" >> "$GITHUB_OUTPUT"
          echo "Due: ${s:-nothing}"
          if [ -z "$s" ]; then
            { echo "run at $(date -u +%Y-%m-%dT%H:%M:%SZ) UTC; no sources due today under the release calendar"
              echo "next release day and what it brings:"
              python -I pipeline/tools/due.py next-refresh
              python -I pipeline/tools/due.py warnings
              echo "result: updated=- failed=-"; } > run_report.txt
          fi

      - name: Fetch, check and rebuild
        id: run
        if: steps.due.outputs.sources != ''
        continue-on-error: true
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
          BPS_KEY: ${{ secrets.BPS_KEY }}
          COMTRADE_KEY: ${{ secrets.COMTRADE_KEY }}
        run: |
          s="${{ steps.due.outputs.sources }}"; [ "$s" = "all" ] && s=""
          rc=0; python -I pipeline/run.py $s || rc=$?
          python -I pipeline/tools/due.py warnings | sed 's/^/   WARNING: /' > /tmp/w.txt
          if [ -s /tmp/w.txt ]; then sed -i '$e cat /tmp/w.txt' run_report.txt; fi
          exit $rc

      - name: Commit what passed
        if: steps.run.outputs.updated == 'true'
        run: |
          git config user.name "asia-vitals bot"
          git config user.email "actions@users.noreply.github.com"
          git add data raw
          git commit -m "Data: ${{ steps.run.outputs.updated_sources }}"
          branch="${{ inputs.push_branch || 'main' }}"
          if [ "$branch" = "main" ]; then
            # other sessions push code to main while a run is going: catch up and retry. Only generated combined files
            # (all_long.csv.gz, Asia tables) can conflict; this run's version wins and the next run rebuilds them.
            for i in 1 2 3 4; do
              git pull -q --rebase -X theirs origin main && git push && exit 0
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            echo "push failed after 4 attempts"; exit 1
          else git push -f origin "HEAD:refs/heads/$branch"; fi

      - name: Publish run report to the run-reports branch
        if: always()
        run: |
          [ -f run_report.txt ] || echo "pipeline did not produce a report (crashed before the end)" > run_report.txt
          mkdir -p /tmp/rr && cp run_report.txt /tmp/rr/ && cd /tmp/rr
          git init -q && git config user.name "asia-vitals bot" && git config user.email "actions@users.noreply.github.com"
          git add run_report.txt && git commit -qm "Run report ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/run-reports

      - name: Flag failed sources
        if: steps.run.outcome == 'failure'
        run: |
          echo "Failed sources: ${{ steps.run.outputs.failed_sources }}"
          exit 1

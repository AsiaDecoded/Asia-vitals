name: MoC (Thailand) discovery (manual)

# One-off helper: probes MoC open data for Thai price indices
# and saves the raw responses to the "discovery" branch, under discovery/moc4.
on:
  workflow_dispatch:
  push:
    branches: [dev-th]
    paths:
      - pipeline/tools/moc_discover.py
      - pipeline/core/moc.py
      - .github/workflows/moc-discover.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query the MoC open data API
        run: timeout 30m python -I -u pipeline/tools/moc_discover.py discovery/moc4 || true
      - name: Push results to the discovery branch
        if: always()
        run: |
          git config user.name "asia-vitals bot"
          git config user.email "actions@users.noreply.github.com"
          mv discovery /tmp/discovery
          if git fetch origin discovery; then
            git checkout -B discovery origin/discovery
          else
            git checkout --orphan discovery && git rm -rf --quiet --cached .
          fi
          mkdir -p discovery && rm -rf discovery/moc4 && cp -r /tmp/discovery/moc4 discovery/
          git add discovery/moc4
          git commit -m "MoC discovery"
          git push origin discovery

name: Crude probe
on:
  push:
    branches: [main]
    paths: [pipeline/tools/crude_probe.py, .github/workflows/crude-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet openpyxl==3.1.5 xlrd==2.0.1 numpy==2.2.6 pypdf==5.1.0
      - run: cd pipeline && python tools/crude_probe.py
        env:
          BPS_KEY: ${{ secrets.BPS_KEY }}

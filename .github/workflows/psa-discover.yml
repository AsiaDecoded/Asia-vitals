name: PSA discovery (manual)

# One-off helper: probes PSA OpenSTAT for Philippine price tables
# and saves the raw responses to the "discovery" branch, under discovery/psa3.
on:
  workflow_dispatch:
  push:
    branches: [dev-ph]
    paths:
      - pipeline/tools/psa_discover.py
      - pipeline/core/psa.py
      - .github/workflows/psa-discover.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query the PSA OpenSTAT API
        run: python -I pipeline/tools/psa_discover.py discovery/psa3
      - name: Push results to the discovery branch
        run: |
          git config user.name "asia-vitals bot"
          git config user.email "actions@users.noreply.github.com"
          mv discovery /tmp/discovery
          if git fetch origin discovery; then
            git checkout -B discovery origin/discovery
          else
            git checkout --orphan discovery && git rm -rf --quiet --cached .
          fi
          mkdir -p discovery && rm -rf discovery/psa3 && cp -r /tmp/discovery/psa3 discovery/
          git add discovery/psa3
          git commit -m "PSA discovery"
          git push origin discovery

name: Non-electronics probe (manual)

# One-off: all manufacturing divisions for Korea (ECOS) and Singapore (SingStat M355381), to test implied weights; saves to the
# "discovery" branch under discovery/nonelec.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pipeline/tools/nonelec_probe.py
      - .github/workflows/nonelec-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: python -I pipeline/tools/nonelec_probe.py discovery/nonelec
      - name: Push results to the discovery branch
        if: always()
        run: |
          git config user.name "asia-vitals bot"
          git config user.email "actions@users.noreply.github.com"
          mv discovery /tmp/discovery
          git fetch origin discovery
          git checkout -B discovery origin/discovery
          mkdir -p discovery && rm -rf discovery/nonelec && cp -r /tmp/discovery/nonelec discovery/
          git add discovery/nonelec
          git commit -m "Non-electronics probe" || exit 0
          for i in 1 2 3; do git push origin discovery && break; git pull --rebase origin discovery; done

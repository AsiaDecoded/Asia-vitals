name: SET/PSEi source probe (dev-eq-probe)
on:
  workflow_dispatch:
  push:
    branches: [dev-eq-probe]
    paths: [pipeline/tools/eq_probe.py, .github/workflows/eq-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -I pipeline/tools/eq_probe.py || true
      - run: |
          git config user.name "asia-vitals bot"; git config user.email "actions@users.noreply.github.com"
          git add discovery/eq_probe && git commit -m "eq probe ${{ github.run_id }}" && git push origin HEAD:${{ github.ref_name }}

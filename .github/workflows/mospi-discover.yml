name: MoSPI discovery (manual)

# One-off helper: probes MoSPI's API for India CPI (2024 base) and WPI (2022-23 base)
# and saves the raw responses to the "discovery" branch, under discovery/mospi.
on:
  workflow_dispatch:
  push:
    branches: [dev-india, main]
    paths:
      - pipeline/tools/rbi_dbie_probe.py
      - .github/workflows/mospi-discover.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PDF reader
        run: pip install -q pdfplumber==0.11.4
      - name: Probe RBI DBIE (India dashboard)
        run: python -I pipeline/tools/rbi_dbie_probe.py discovery/rbi_dbie
      - name: Push results to the discovery branch
        run: |
          git config user.name "asia-vitals bot"
          git config user.email "actions@users.noreply.github.com"
          mv discovery /tmp/discovery
          if git fetch origin discovery; then
            git checkout -B discovery origin/discovery
          else
            git checkout --orphan discovery && git rm -rf --quiet --cached .
          fi
          mkdir -p discovery && rm -rf discovery/rbi_dbie && cp -r /tmp/discovery/rbi_dbie discovery/
          git add discovery/rbi_dbie
          git commit -m "MoSPI IIP and ASI discovery"
          git push origin discovery

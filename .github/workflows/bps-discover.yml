name: BPS (Indonesia) discovery

# One-off helper: probes BPS, Bank Indonesia SEKI and Satu Data for Indonesian price data
# and saves the raw responses to the "discovery" branch, under discovery/bps12 (fiscal round 6, APBN KiTa listing; bps7-11 fiscal, bps6 GDP and trade).
on:
  workflow_dispatch:
  push:
    branches: [dev-id]
    paths:
      - pipeline/tools/bps_discover.py
      - pipeline/tools/bps_api_discover.py
      - pipeline/tools/bps_api_probe.py
      - pipeline/tools/bps_gdp_trade_probe.py
      - pipeline/tools/fiscal_probe.py
      - pipeline/tools/fiscal_probe2.py
      - pipeline/tools/fiscal_probe3.py
      - pipeline/tools/fiscal_probe4.py
      - pipeline/tools/fiscal_probe6.py
      - .github/workflows/bps-discover.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: sudo apt-get install -y -qq poppler-utils && pip install -q xlrd
      - name: Probe the sources
        run: timeout 40m python -I -u pipeline/tools/fiscal_probe6.py discovery/bps12 || true
        env:
          BPS_KEY: ${{ secrets.BPS_KEY }}
      - name: Push results to the discovery branch
        if: always()
        run: |
          git config user.name "asia-vitals bot"
          git config user.email "actions@users.noreply.github.com"
          mv discovery /tmp/discovery
          if git fetch origin discovery; then
            git checkout -B discovery origin/discovery
          else
            git checkout --orphan discovery && git rm -rf --quiet --cached .
          fi
          mkdir -p discovery && rm -rf discovery/bps12 && cp -r /tmp/discovery/bps12 discovery/
          git add discovery/bps12
          git commit -m "BPS discovery"
          git push origin discovery
